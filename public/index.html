<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PC Repair Shop - Formulieren</title>

    <style>
        body {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: Arial, sans-serif;
            color: #111;
        }

        h1 {
            margin-bottom: 8px;
        }

        .form-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .form-card {
            padding: 24px;
            border: 1px solid #999;
        }

        .form-card h2 {
            margin-top: 0;
        }

        .form-card p {
            min-height: 48px;
            line-height: 1.5;
        }

        .button {
            display: inline-block;
            padding: 10px 16px;
            border: 1px solid #333;
            background: #f2f2f2;
            color: #000;
            text-decoration: none;
        }

        .button:hover {
            background: #ddd;
        }
    </style>
</head>

<body>
<header>
    <h1>PC Repair Shop</h1>
    <p>Kies het formulier dat je wilt gebruiken.</p>
</header>

<main class="form-list">
    <section class="form-card">
        <h2>Reparatie- en verkoopbon</h2>

        <p>
            Maak een nieuwe bon voor een reparatie, verkoop
            of aanvullende artikelen.
        </p>

        <a class="button" href="reparatie/">
            Nieuwe reparatiebon
        </a>
    </section>

    <section class="form-card">
        <h2>Stichting Leergeld</h2>

        <p>
            Maak een nieuwe uitgiftebon voor een laptop van
            Stichting Leergeld.
        </p>

        <a class="button" href="leergeld/">
            Nieuwe Leergeld-bon
        </a>
    </section>
</main>
</body>
</html>
